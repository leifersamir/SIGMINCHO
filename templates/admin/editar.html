{% extends "admin/base_admin.html" %}

{% block titulo %}
Editar Usuario
{% endblock %}

{% block encabezado %}
Editar Usuario
{% endblock %}

{% block contenido %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow border-0">

                <div class="card-header bg-warning text-dark">

                    <h4 class="mb-0">
                        <i class="bi bi-pencil-square"></i>
                        Editar información del usuario
                    </h4>

                </div>

                <div class="card-body">

                    <form action="/actualizar/{{ usuario[0] }}" method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Nombre
                            </label>

                            <input
                                type="text"
                                name="nombre"
                                class="form-control"
                                value="{{ usuario[1] }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Usuario
                            </label>

                            <input
                                type="text"
                                name="usuario"
                                class="form-control"
                                value="{{ usuario[2] }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Correo
                            </label>

                            <input
                                type="email"
                                name="correo"
                                class="form-control"
                                value="{{ usuario[3] }}"
                                required>

                        </div>
                        
                                 <div class="mb-3">

    <label class="form-label fw-bold">
        Rol
    </label>

    <select
        name="rol"
        class="form-select"
        required
    >

        <option
            value="usuario"
            {% if usuario[5] == "usuario" %}selected{% endif %}
        >
            Usuario
        </option>

        <option
            value="admin"
            {% if usuario[5] == "admin" %}selected{% endif %}
        >
            Administrador
        </option>

    </select>

</div>

                        <div class="d-flex justify-content-between mt-4">

                            <a href="/usuarios"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>

                                Volver

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success">

                                <i class="bi bi-check-circle-fill"></i>

                                Guardar cambios

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
