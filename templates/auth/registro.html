<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - Minería Ilegal en el Chocó</title>

    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body class="bg-success bg-gradient">

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-lg border-0 rounded-4 p-4" style="max-width:500px; width:100%;">

        <div class="text-center mb-4">

            <img src="{{ url_for('static', filename='img/favicon.ico') }}"
                 width="70"
                 class="mb-3">

            <h2 class="fw-bold text-success">

                Crear Cuenta

            </h2>

            <p class="text-muted">

                Completa los datos para registrarte

            </p>

        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for categoria, mensaje in messages %}

                    {% if categoria == "success" %}

                        <div class="alert alert-success">

                            {{ mensaje }}

                        </div>

                    {% else %}

                        <div class="alert alert-danger">

                            {{ mensaje }}

                        </div>

                    {% endif %}

                {% endfor %}

            {% endif %}

        {% endwith %}

        <form action="/registrar" method="POST">

            <div class="mb-3">

                <label class="form-label">

                    Nombre completo

                </label>

                <input
                    type="text"
                    name="nombre"
                    class="form-control"
                    placeholder="Ingrese su nombre"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Usuario

                </label>

                <input
                    type="text"
                    name="usuario"
                    class="form-control"
                    placeholder="Ingrese un usuario"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Correo electrónico

                </label>

                <input
                    type="email"
                    name="correo"
                    class="form-control"
                    placeholder="Ingrese su correo"
                    required>

            </div>

            <div class="mb-4">

    <label class="form-label">

        Contraseña

    </label>

    <div class="input-group">

        <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Ingrese una contraseña"
            required>

        <button
            class="btn btn-outline-secondary"
            type="button"
            onclick="mostrarPassword()">

            <i class="bi bi-eye" id="icono"></i>

        </button>

    </div>

    <div id="seguridad" class="mt-2 fw-bold"></div>

</div>

    
            

            <div class="d-grid">

                <button
                    type="submit"
                    class="btn btn-success btn-lg">

                    Registrarse

                </button>

            </div>

        </form>

       

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
function mostrarPassword(){
    const password = document.getElementById("password");
    const icono = document.getElementById("icono");

    if(password.type === "password"){
        password.type = "text";
        icono.className = "bi bi-eye-slash";
    }else{
        password.type = "password";
        icono.className = "bi bi-eye";
    }
}
</script>
</body>

</html>
